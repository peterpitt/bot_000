<title>星際智囊團工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* 版面概念：觀測台。左側提案單與召集星圖固定，右側是激辯紀錄長卷；手機改單欄。 */
:root {
  --paper: #edf0f3;
  --panel: #f9fafb;
  --ink: #17202b;
  --muted: #586373;
  --rule: #cdd4dc;
  --brass: #94650f;
  --brass-soft: #efe4cc;
  --orbit: #2f4a6b;
  --ok: #2b7a4b;
  --warn: #a85414;
  --bad: #b03636;
  --ok-soft: #dcefe3;
  --warn-soft: #f6e3d3;
  --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --step--1: 0.8125rem;
  --step-0: 0.9375rem;
  --step-1: 1.125rem;
  --step-2: 1.4rem;
  --step-3: 1.85rem;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1319; --panel: #161b23; --ink: #e5e9ee; --muted: #9aa5b3; --rule: #2a323d;
    --brass: #d9a548; --brass-soft: #362d1d; --orbit: #8fb0d6;
    --ok: #62c08a; --warn: #e49a5c; --bad: #e57070; --ok-soft: #173325; --warn-soft: #3a2616;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1319; --panel: #161b23; --ink: #e5e9ee; --muted: #9aa5b3; --rule: #2a323d;
  --brass: #d9a548; --brass-soft: #362d1d; --orbit: #8fb0d6;
  --ok: #62c08a; --warn: #e49a5c; --bad: #e57070; --ok-soft: #173325; --warn-soft: #3a2616;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: var(--step-0); line-height: 1.7;
  padding-inline: 16px; padding-block: 0 48px;
}
.shell { max-width: 1240px; margin-inline: auto; }
h1, h2, h3, h4 { font-family: var(--font-display); text-wrap: balance; line-height: 1.3; margin: 0; }
p { margin: 0; }
.top {
  display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between;
  padding-block: 24px 20px; border-bottom: 1px solid var(--rule);
}
.brand { display: flex; gap: 14px; align-items: center; min-width: 0; }
.brand svg { flex: none; }
.brand h1 { font-size: var(--step-3); letter-spacing: 0.02em; }
.brand p { color: var(--muted); font-size: var(--step--1); }
.engine {
  font-family: var(--font-mono); font-size: var(--step--1); color: var(--muted);
  border: 1px solid var(--rule); border-radius: 999px; padding: 4px 12px; display: flex; gap: 8px; align-items: center;
}
.engine::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.engine[data-state="on"]::before { background: var(--ok); }
.engine[data-state="off"]::before { background: var(--warn); }

.grid { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 28px; padding-top: 24px; align-items: start; }
@media (max-width: 880px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.intake { display: grid; gap: 20px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow-y: auto; overscroll-behavior: contain; }
@media (max-width: 880px) { .intake { position: static; max-height: none; overflow: visible; } }

.card { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); padding: 18px; }
.label-eyebrow { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--brass); }
form { display: grid; gap: 12px; }
form h2 { font-size: var(--step-2); }
label { font-size: var(--step--1); font-weight: 500; color: var(--muted); display: block; margin-bottom: 4px; }
textarea, input[type="text"], select {
  width: 100%; font: inherit; color: var(--ink); background: var(--paper);
  border: 1px solid var(--rule); border-radius: var(--radius); padding: 8px 10px;
}
textarea { resize: vertical; min-height: 120px; }
textarea:focus, input:focus, select:focus, button:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .two { grid-template-columns: 1fr; } }
.check { display: flex; gap: 8px; align-items: center; color: var(--ink); font-size: var(--step-0); font-weight: 400; margin: 0; }
.check input { width: 16px; height: 16px; accent-color: var(--brass); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
button {
  font: inherit; font-weight: 500; cursor: pointer; border-radius: var(--radius);
  border: 1px solid var(--brass); background: var(--brass); color: var(--panel); padding: 8px 18px;
}
button.ghost { background: transparent; color: var(--brass); }
button:disabled { opacity: 0.55; cursor: progress; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: var(--step--1); color: var(--muted); }
.steps li { display: flex; gap: 8px; align-items: baseline; }
.steps li span:first-child { font-family: var(--font-mono); width: 1.4em; }
.steps li[data-s="active"] { color: var(--ink); font-weight: 500; }
.steps li[data-s="active"] span:first-child { color: var(--brass); }
.steps li[data-s="done"] span:first-child { color: var(--ok); }
.msg { font-size: var(--step--1); color: var(--warn); }

.orbit-card h3, .history h3 { font-size: var(--step-1); margin-bottom: 8px; }
#orbit { width: 100%; max-width: 320px; display: block; margin-inline: auto; }
#orbit .ring { fill: none; stroke: var(--rule); }
#orbit .ray { stroke: var(--brass); stroke-width: 1; opacity: 0.6; }
#orbit .dot { fill: var(--panel); stroke: var(--muted); }
#orbit .dot.on { fill: var(--brass); stroke: var(--brass); }
#orbit text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
#orbit text.on { fill: var(--ink); font-weight: 700; }
#orbit .core { fill: var(--orbit); }
#orbit .core-t { fill: var(--panel); font-size: 11px; font-weight: 700; }
.topics { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: 0.75rem; border: 1px solid var(--rule); border-radius: 999px; padding: 1px 10px; color: var(--muted); white-space: nowrap; }
.chip.brass { border-color: var(--brass); color: var(--brass); }
.chip.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.chip.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.history ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.history button {
  width: 100%; text-align: left; background: transparent; border: 0; color: var(--ink); padding: 6px 8px;
  display: grid; gap: 0; font-weight: 400;
}
.history button:hover { background: var(--paper); }
.history small { color: var(--muted); font-family: var(--font-mono); font-size: 0.72rem; }
.history .empty { color: var(--muted); font-size: var(--step--1); }

.record { min-width: 0; display: grid; gap: 22px; }
.toc { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--step--1); border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
.toc a { color: var(--muted); text-decoration: none; }
.toc a:hover { color: var(--brass); }
.banner { font-size: var(--step--1); color: var(--brass); background: var(--brass-soft); border-radius: var(--radius); padding: 8px 12px; }
section.block { display: grid; gap: 12px; scroll-margin-top: 16px; }
section.block > h2 { font-size: var(--step-2); display: flex; gap: 10px; align-items: baseline; }
section.block > h2 .label-eyebrow { font-family: var(--font-mono); }
.verdict { border-left: 3px solid var(--brass); padding: 4px 0 4px 16px; display: grid; gap: 8px; }
.verdict .big { font-family: var(--font-display); font-size: var(--step-2); line-height: 1.45; }
dl.kv { display: grid; grid-template-columns: 9em minmax(0, 1fr); gap: 6px 16px; margin: 0; }
dl.kv dt { color: var(--muted); font-size: var(--step--1); padding-top: 2px; }
dl.kv dd { margin: 0; min-width: 0; }
@media (max-width: 520px) { dl.kv { grid-template-columns: minmax(0, 1fr); } dl.kv dd { margin-bottom: 6px; } }
ul.plain { margin: 0; padding-left: 1.2em; }
.debate { display: grid; gap: 0; }
.voice { display: grid; grid-template-columns: 8.5em minmax(0, 1fr); gap: 4px 16px; padding: 12px 0; border-top: 1px solid var(--rule); }
.voice:first-child { border-top: 0; }
.voice .who { font-weight: 700; }
.voice .who small { display: block; font-weight: 400; color: var(--muted); font-size: 0.75rem; line-height: 1.4; }
.voice .obj { color: var(--muted); font-size: var(--step--1); }
.voice .obj b { color: var(--warn); font-weight: 500; }
.voice .sym { color: var(--muted); font-size: 0.72rem; }
@media (max-width: 520px) { .voice { grid-template-columns: minmax(0, 1fr); } }
.quad { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 620px) { .quad { grid-template-columns: minmax(0, 1fr); } }
.quad > div { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); padding: 12px 14px; min-width: 0; }
.quad h4 { font-family: var(--font-body); font-size: var(--step--1); color: var(--muted); font-weight: 500; margin-bottom: 4px; }
.quad .risk { border-color: var(--warn); }
.signals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 620px) { .signals { grid-template-columns: minmax(0, 1fr); } }
.signals > div { padding: 10px 14px; border-radius: var(--radius); min-width: 0; }
.signals .go { background: var(--ok-soft); }
.signals .stop { background: var(--warn-soft); }
.signals h4 { font-family: var(--font-body); font-size: var(--step--1); margin-bottom: 2px; }
.signals .go h4 { color: var(--ok); }
.signals .stop h4 { color: var(--warn); }
.tablewrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: var(--step--1); }
th, td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--rule); }
th { color: var(--muted); font-weight: 500; white-space: nowrap; background: var(--paper); }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
td ul { margin: 0; padding-left: 1.1em; }
.note { font-size: var(--step--1); color: var(--muted); }
.prompt { display: grid; gap: 6px; border: 1px solid var(--rule); border-radius: var(--radius); padding: 12px 14px; background: var(--panel); }
.prompt pre { margin: 0; white-space: pre-wrap; font-family: var(--font-mono); font-size: 0.8rem; background: var(--paper); border-radius: 4px; padding: 10px; overflow-x: auto; }
.prompt .meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: var(--step--1); color: var(--muted); }
.prompt .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.small-btn { font-size: var(--step--1); padding: 3px 10px; }
.funnel { display: grid; gap: 0; }
.funnel > div { display: grid; grid-template-columns: 7em minmax(0, 1fr); gap: 12px; padding: 8px 0; border-top: 1px dashed var(--rule); }
.funnel > div:first-child { border-top: 0; }
.funnel .k { color: var(--brass); font-size: var(--step--1); font-weight: 500; }
.deliver { border: 1px solid var(--brass); border-radius: var(--radius); background: var(--panel); }
.deliver header { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--rule); }
.deliver header h3 { font-size: var(--step-1); }
.deliver header p { color: var(--muted); font-size: var(--step--1); }
.deliver .tools { display: flex; gap: 8px; flex-wrap: wrap; }
.doc { padding: 16px 20px 20px; max-width: 72ch; min-width: 0; }
.doc h2, .doc h3, .doc h4, .doc h5 { margin: 1.1em 0 0.4em; }
.doc h2 { font-size: var(--step-2); } .doc h3 { font-size: var(--step-1); } .doc h4, .doc h5 { font-size: var(--step-0); }
.doc > :first-child { margin-top: 0; }
.doc p, .doc ul, .doc ol, .doc blockquote, .doc pre, .doc .tablewrap { margin: 0 0 0.8em; }
.doc ul, .doc ol { padding-left: 1.3em; }
.doc li.task { list-style: none; margin-left: -1.3em; }
.doc .box { display: inline-block; width: 1em; color: var(--brass); }
.doc blockquote { border-left: 3px solid var(--rule); padding-left: 12px; color: var(--muted); }
.doc pre { background: var(--paper); padding: 10px; border-radius: 4px; overflow-x: auto; font-family: var(--font-mono); font-size: 0.8rem; }
.doc code { font-family: var(--font-mono); font-size: 0.85em; background: var(--paper); padding: 0 4px; border-radius: 3px; }
.doc mark { background: var(--brass-soft); color: var(--ink); padding: 0 2px; border-radius: 2px; }
.doc hr { border: 0; border-top: 1px solid var(--rule); margin: 1em 0; }
.next { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.next label { display: flex; gap: 10px; align-items: baseline; color: var(--ink); font-size: var(--step-0); font-weight: 400; margin: 0; }
.next input { accent-color: var(--brass); }
.pending { color: var(--muted); font-size: var(--step--1); padding: 16px 20px; }
@media (prefers-reduced-motion: no-preference) {
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.45; } }
}
</style>

<div class="shell">
  <header class="top">
    <div class="brand">
      <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
        <circle cx="22" cy="22" r="19" fill="none" stroke="var(--rule)"/>
        <circle cx="22" cy="22" r="11" fill="none" stroke="var(--rule)"/>
        <circle cx="22" cy="22" r="4.5" fill="var(--orbit)"/>
        <circle cx="38" cy="13" r="3.2" fill="var(--brass)"/>
        <circle cx="13" cy="30" r="2.4" fill="var(--muted)"/>
      </svg>
      <div>
        <h1>星際智囊團工作台</h1>
        <p>輸入想法，12 位行星顧問激辯收斂，交付今天就能用的最小成品</p>
      </div>
    </div>
    <div class="engine" id="engine">連線檢查中</div>
  </header>

  <div class="grid">
    <aside class="intake">
      <form id="form" class="card">
        <div class="label-eyebrow">提案單</div>
        <h2>把想法交給智囊團</h2>
        <div>
          <label for="idea">你的想法（必填）</label>
          <textarea id="idea" required placeholder="例如：幫台灣中小型咖啡店做 AI 客服與 IG 內容代營運"></textarea>
        </div>
        <div class="two">
          <div><label for="audience">目標客群</label><input type="text" id="audience" placeholder="誰最痛、最願意付費"></div>
          <div><label for="budget">可用資源／預算</label><input type="text" id="budget" placeholder="時間、資金、技能"></div>
        </div>
        <div class="two">
          <div><label for="timeline">希望時程</label><input type="text" id="timeline" placeholder="例如：30 天內第一筆收入"></div>
          <div>
            <label for="mvpType">想要的最小成品</label>
            <select id="mvpType">
              <option value="">讓智囊團判斷</option>
              <option>銷售頁文案</option>
              <option>客戶訪談腳本</option>
              <option>服務提案與報價單</option>
              <option>社群貼文組（7 篇）</option>
              <option>7 天驗證計畫</option>
              <option>SOP 檢查表</option>
              <option>AI 提示詞包</option>
              <option>外包派工需求書</option>
            </select>
          </div>
        </div>
        <label class="check" for="outsource"><input type="checkbox" id="outsource"> 考慮把部分工作外包給其他公司</label>
        <div class="actions">
          <button type="submit" id="go">召集智囊團</button>
          <button type="button" id="stop" class="ghost" hidden>停止</button>
        </div>
        <ol class="steps" id="steps" aria-live="polite">
          <li data-s="idle"><span>1</span><span>問題分流、召集顧問</span></li>
          <li data-s="idle"><span>2</span><span>星際激辯與戰略收斂</span></li>
          <li data-s="idle"><span>3</span><span>製作最小成品</span></li>
        </ol>
        <p class="msg" id="msg" hidden></p>
      </form>

      <section class="card orbit-card">
        <div class="label-eyebrow">召集星圖</div>
        <h3>本次出席的顧問</h3>
        <svg id="orbit" viewBox="0 0 320 320" role="img" aria-label="12 位行星顧問，亮起者為本次召集"></svg>
        <div class="topics" id="topics"></div>
      </section>

      <section class="card history">
        <div class="label-eyebrow">只存在這個瀏覽器</div>
        <h3>最近的提案</h3>
        <ul id="history"></ul>
      </section>
    </aside>

    <main class="record">
      <nav class="toc" aria-label="段落">
        <a href="#s-conclusion">結論</a><a href="#s-problem">問題定義</a><a href="#s-debate">星際激辯</a>
        <a href="#s-strategy">戰略收斂</a><a href="#s-roadmap">落地藍圖</a><a href="#s-cash">派工與金流</a>
        <a href="#s-prompts">AI 指令</a><a href="#s-growth">行銷變現</a><a href="#s-mvp">最小成品</a><a href="#s-next">下一步</a>
      </nav>
      <div class="banner" id="banner">以下是範例輸出，示範智囊團會交付什麼。填寫左側提案單後按「召集智囊團」產生你的版本。</div>
      <div id="out" class="record"></div>
    </main>
  </div>
</div>

function countOf(hay, needle) { let n = 0, i = 0; while ((i = hay.indexOf(needle, i)) !== -1) { n++; i += needle.length; } return n; }
function triage(text) {
  const q = text.toLowerCase();
  const scores = Object.fromEntries(Object.entries(KEYWORDS).map(([t, ks]) => [t, ks.reduce((s, k) => s + countOf(q, k), 0)]));
  const order = Object.keys(KEYWORDS);
  const hits = order.filter(t => scores[t]).sort((a, b) => scores[b] - scores[a] || order.indexOf(a) - order.indexOf(b));
  return hits.length ? hits : ["business_model"];
}
function selectAdvisors(topics, min = 4, max = 6) {
  const weight = Object.fromEntries(topics.map((t, i) => [t, topics.length - i]));
  let chosen = ADVISORS.map((a, i) => ({ a, i, s: a.topics.reduce((s, t) => s + (weight[t] || 0), 0) }))
    .filter(x => x.s > 0).sort((x, y) => y.s - x.s || x.i - y.i).slice(0, max).map(x => x.a);
  if (topics.includes("finance") || topics.includes("dispatch")) {
    const forced = [BY_ID.pluto, BY_ID.polaris];
    chosen = forced.concat(chosen.filter(a => !forced.includes(a))).slice(0, max);
  }
  for (const id of FALLBACK) { if (chosen.length >= min) break; if (!chosen.includes(BY_ID[id])) chosen.push(BY_ID[id]); }

}

function md(src) {
  const lines = str(src).replace(/\r/g, "").split("\n");
  const out = [];
  const isList = l => /^\s*([-*+]|\d+[.)])\s+/.test(l);
  let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    let m;
    if (/^\s*```/.test(l)) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`); continue;
    }
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { const n = m[1].length + 1; out.push(`<h${n}>${inline(m[2])}</h${n}>`); i++; continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)) { out.push("<hr>"); i++; continue; }
    if (/^\s*\|/.test(l)) { const rows = []; while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]); out.push(mdTable(rows)); continue; }
    if (isList(l)) {
      const ordered = /^\s*\d/.test(l); const items = [];
      while (i < lines.length && isList(lines[i])) items.push(lines[i++].replace(/^\s*([-*+]|\d+[.)])\s+/, ""));
      const html = items.map(t => {
        const task = t.match(/^\[( |x|X)\]\s*(.*)/);
        return task ? `<li class="task"><span class="box">${task[1] === " " ? "☐" : "☑"}</span>${inline(task[2])}</li>` : `<li>${inline(t)}</li>`;
      }).join("");
      out.push(ordered ? `<ol>${html}</ol>` : `<ul>${html}</ul>`); continue;
    }
    if (/^\s*>/.test(l)) { const buf = []; while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, "")); out.push(`<blockquote>${buf.map(inline).join("<br>")}</blockquote>`); continue; }
    if (!l.trim()) { i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|\s*```|\s*\||\s*>)/.test(lines[i]) && !isList(lines[i])) para.push(lines[i++]);
    out.push(`<p>${para.map(inline).join("<br>")}</p>`);
  }
  return out.join("");
}

function dispatchTable(ds) {
  if (!ds.length) return `<p class="note">這個方案先不需要外包，全部由你和 AI 完成，現金只流入不流出。</p>`;
  let price = 0, cost = 0;
  const rows = ds.map(d => {
    let marginCell;
    if (d.mode === "pass_through") {
      marginCell = `<span class="chip brass">代收代付・只算佣金</span>`;
    } else {
      price += d.price; cost += d.cost;
      const mg = d.price > 0 ? (d.price - d.cost) / d.price : 0;
      marginCell = `<span class="chip ${mg >= 0.3 ? "ok" : "warn"}">${(mg * 100).toFixed(0)}%${mg >= 0.3 ? "" : "・低於 30% 底線"}</span>`;
    }
    return `<tr><td>${esc(d.item)}</td><td>${esc(d.partner)}</td><td>${d.mode === "pass_through" ? "代收代付" : "轉包"}</td><td class="num">${twd(d.price)}</td><td class="num">${twd(d.cost)}</td><td>${marginCell}</td><td>${esc(d.acceptance)}</td><td>${esc(d.backup)}</td></tr>`;
  }).join("");
  const total = price > 0 ? `<tr><td><strong>轉包合計</strong></td><td></td><td></td><td class="num">${twd(price)}</td><td class="num">${twd(cost)}</td><td><span class="chip ${(price - cost) / price >= 0.3 ? "ok" : "warn"}">${(((price - cost) / price) * 100).toFixed(0)}%</span></td><td colspan="2" class="note">毛利 ${twd(price - cost)}</td></tr>` : "";
  return `<div class="tablewrap"><table><thead><tr><th>派工項目</th><th>合作對象</th><th>金流模式</th><th class="num">對客戶售價</th><th class="num">外包成本</th><th>毛利率</th><th>驗收標準</th><th>備援</th></tr></thead><tbody>${rows}${total}</tbody></table></div>`;
}

function updateDoc(text) {

async function copyText(text, btn) {
  const old = btn.textContent;
  try { await navigator.clipboard.writeText(text); btn.textContent = "已複製"; }
  catch (_) {
    const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); btn.textContent = "已複製"; } catch (_) { btn.textContent = "請手動複製"; }
    ta.remove();
  }
  setTimeout(() => { btn.textContent = old; }, 1600);
}
async function saveMvp() {

const SVGNS = "http://www.w3.org/2000/svg";
const orbitEl = document.getElementById("orbit");

function drawOrbit(onIds) {
  const on = new Set(onIds);
  const c = 160, rDot = 100, rText = 133;
  const parts = [`<circle class="ring" cx="${c}" cy="${c}" r="${rDot}"/>`, `<circle class="ring" cx="${c}" cy="${c}" r="52" stroke-dasharray="2 4"/>`];
  ADVISORS.forEach((a, i) => {
    const ang = -Math.PI / 2 + (i * 2 * Math.PI) / ADVISORS.length;
    const x = c + rDot * Math.cos(ang), y = c + rDot * Math.sin(ang);
    if (on.has(a.id)) parts.push(`<line class="ray" x1="${c}" y1="${c}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`);
  });
  ADVISORS.forEach((a, i) => {
    const ang = -Math.PI / 2 + (i * 2 * Math.PI) / ADVISORS.length;
    const x = c + rDot * Math.cos(ang), y = c + rDot * Math.sin(ang);
    const tx = c + rText * Math.cos(ang), ty = c + rText * Math.sin(ang) + 4;
    const lit = on.has(a.id);
    parts.push(`<circle class="dot ${lit ? "on" : ""}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${lit ? 8 : 5}"><title>${a.name}｜${a.title}</title></circle>`);
    parts.push(`<text class="${lit ? "on" : ""}" x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle">${a.name}</text>`);
  });
  parts.push(`<circle class="core" cx="${c}" cy="${c}" r="26"/><text class="core-t" x="${c}" y="${c + 4}" text-anchor="middle">策略總召</text>`);
  orbitEl.innerHTML = parts.join("");
}

const out = document.getElementById("out");
const form = document.getElementById("form");
const goBtn = document.getElementById("go");
const stopBtn = document.getElementById("stop");
const msgEl = document.getElementById("msg");
const banner = document.getElementById("banner");

const fields = ["idea", "audience", "budget", "timeline", "mvpType"];
let current = { input: null, result: null, mvpText: "" };
let ctl = null;
const HKEY = "council.history.v1";

function setSteps(active, doneUpTo) { stepEls.forEach((el, i) => { el.dataset.s = i < doneUpTo ? "done" : i === active ? "active" : "idle"; el.firstElementChild.textContent = i < doneUpTo ? "✓" : String(i + 1); }); }
function showMsg(t) { msgEl.hidden = !t; msgEl.textContent = t || ""; }
function busy(on) { goBtn.disabled = on; stopBtn.hidden = !on; }
function readHistory() { try { return JSON.parse(localStorage.getItem(HKEY) || "[]"); } catch (_) { return []; } }
function writeHistory(list) { try { localStorage.setItem(HKEY, JSON.stringify(list.slice(0, 8))); } catch (_) {} }
function saveCurrent() {
  if (!current.result) return;
  const list = readHistory().filter(h => h.id !== current.id);
  list.unshift({ id: current.id, at: new Date().toISOString(), input: current.input, result: current.result, mvpText: current.mvpText });
  writeHistory(list); renderHistory();
}
function renderHistory() {
  const ul = document.getElementById("history");
  const list = readHistory();
  if (!list.length) { ul.innerHTML = `<li class="empty">還沒有提案。你送出的提案會留在這個瀏覽器，方便回頭查看。</li>`; return; }
  ul.innerHTML = list.map((h, i) => `<li><button type="button" data-h="${i}"><span>${esc(h.input.idea.slice(0, 34))}${h.input.idea.length > 34 ? "…" : ""}</span><small>${esc(new Date(h.at).toLocaleString("zh-TW", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }))}</small></button></li>`).join("");
  ul.querySelectorAll("[data-h]").forEach(b => b.addEventListener("click", () => {
    const h = readHistory()[+b.dataset.h]; if (!h) return;
    current = { id: h.id, input: h.input, result: h.result, mvpText: h.mvpText || "" };
    fields.forEach(f => { document.getElementById(f).value = h.input[f] || ""; });
    document.getElementById("outsource").checked = !!h.input.outsource;
    banner.hidden = true; showMsg(""); setSteps(-1, h.mvpText ? 3 : 2);
    render(current.result, current.mvpText, { canSave: !!(engine && engine.downloads), canRegen: !!engine });
  }));
}

// ---------------------------------------------------------------- 主流程
form.addEventListener("submit", async ev => {
  ev.preventDefault();
  const input = Object.fromEntries(fields.map(f => [f, document.getElementById(f).value.trim()]));
  input.outsource = document.getElementById("outsource").checked;
  if (!input.idea) { showMsg("請先寫下你的想法。"); return; }
  let topics = triage([input.idea, input.audience, input.budget, input.timeline].join(" "));
  if (input.outsource && !topics.includes("dispatch")) topics.push("dispatch");
  const advisors = selectAdvisors(topics);
  drawOrbit(advisors.map(a => a.id));
  topicsEl.innerHTML = topics.map(t => `<span class="chip brass">${esc(TOPICS[t])}</span>`).join("");
  showMsg(""); setSteps(1, 1);
  if (!engine) { showMsg("目前無法連線 AI。可在 claude.ai 開啟此頁，或在本機執行 python -m consultancy serve 並設定 XAI_API_KEY。"); setSteps(-1, 0); return; }
  busy(true);
  ctl = new AbortController();
  banner.hidden = true;
  out.innerHTML = `<p class="pending pulse">${advisors.map(a => a.name).join("、")} 正在激辯，通常需要 30–90 秒…</p>`;
  if (window.matchMedia("(max-width: 880px)").matches) out.scrollIntoView({ block: "start" });
  try {
    const raw = await ask(buildAdvicePrompt(input, topics, advisors), { json: true, signal: ctl.signal });
    const result = normalize(raw);
    result._advisors = advisors.map(a => ({ id: a.id })); result._topics = topics;
    current = { id: String(Date.now()), input, result, mvpText: "" };
    render(result, "", { mvpPending: true });
    saveCurrent();
    setSteps(2, 2);
    await makeMvp(false);
  } catch (e) {
    if (e && e.code === "cancelled") { showMsg("已停止。"); }
    else { showMsg(errText(e)); }
    if (!current.result || current.input !== input) out.innerHTML = `<p class="note">這次沒有產生結果。調整後再按「召集智囊團」。</p>`;
    setSteps(-1, current.input === input && current.result ? 2 : 0);
  } finally { busy(false); }
});

async function makeMvp(regen) {
  if (!current.result || !engine) return;
  const r = current.result;
  busy(true);
  ctl = new AbortController();
  setSteps(2, 2);
  render(r, "", { mvpPending: true });
  let raf = 0, latest = "";
  try {
    const text = await ask(buildMvpPrompt(current.input, r), {
      signal: ctl.signal, cache: regen ? false : undefined,
      onText: ({ text }) => { latest = text; if (!raf) raf = requestAnimationFrame(() => { raf = 0; updateDoc(latest); }); },
    });
    current.mvpText = text;
    setSteps(-1, 3);
  } catch (e) {
    current.mvpText = (e && e.text) || "";
    showMsg(e && e.code === "cancelled" ? "已停止製作最小成品。" : errText(e));
    setSteps(-1, 2);
  } finally {
    if (raf) cancelAnimationFrame(raf);
    render(r, current.mvpText, { canSave: !!(engine && engine.downloads), canRegen: true });
    saveCurrent();
    busy(false);
  }
}
